<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>House Inventory</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>House Inventory</h1>
    <div class="topbar-actions">
      <button id="exportJson" class="btn ghost" type="button">Export JSON</button>
      <button id="exportCsv" class="btn ghost" type="button">Export CSV</button>
      <label class="btn ghost">
        Import
        <input id="importFile" type="file" accept="application/json,.json" hidden>
      </label>
      <button id="addItem" class="btn primary" type="button">+ Add item</button>
    </div>
  </header>

  <main>
    <section class="stats" aria-label="Summary">
      <div class="stat"><span class="stat-label">Items</span><span id="statItems" class="stat-value">0</span></div>
      <div class="stat"><span class="stat-label">Total quantity</span><span id="statQty" class="stat-value">0</span></div>
      <div class="stat"><span class="stat-label">Total value</span><span id="statValue" class="stat-value">0.00</span></div>
      <div class="stat"><span class="stat-label">Rooms</span><span id="statRooms" class="stat-value">0</span></div>
    </section>

    <section class="filters" aria-label="Filters">
      <input id="search" type="search" placeholder="Search name, notes, brand, serial…">
      <select id="filterRoom"><option value="">All rooms</option></select>
      <select id="filterCategory"><option value="">All categories</option></select>
      <select id="sortBy">
        <option value="name">Sort: Name</option>
        <option value="room">Sort: Room</option>
        <option value="value-desc">Sort: Value (high → low)</option>
        <option value="value-asc">Sort: Value (low → high)</option>
        <option value="date-desc">Sort: Purchase date (newest)</option>
        <option value="updated-desc">Sort: Recently updated</option>
      </select>
    </section>

    <section id="roomSummary" class="room-summary" aria-label="Value by room"></section>

    <section>
      <div id="emptyState" class="empty" hidden>
        <p>No items yet. Click <strong>+ Add item</strong> to start your inventory.</p>
      </div>
      <div id="noMatches" class="empty" hidden>
        <p>No items match your filters.</p>
      </div>
      <ul id="itemList" class="item-list"></ul>
    </section>
  </main>

  <dialog id="itemDialog">
    <form id="itemForm" method="dialog">
      <h2 id="dialogTitle">Add item</h2>
      <input type="hidden" name="id">
      <div class="grid">
        <label class="span-2">Name *
          <input name="name" required maxlength="120">
        </label>
        <label>Room *
          <input name="room" required list="roomOptions" maxlength="60">
        </label>
        <label>Category
          <input name="category" list="categoryOptions" maxlength="60">
        </label>
        <label>Quantity
          <input name="quantity" type="number" min="0" step="1" value="1">
        </label>
        <label>Value (each)
          <input name="value" type="number" min="0" step="0.01" placeholder="0.00">
        </label>
        <label>Brand / Model
          <input name="brand" maxlength="120">
        </label>
        <label>Serial number
          <input name="serial" maxlength="120">
        </label>
        <label>Purchase date
          <input name="purchaseDate" type="date">
        </label>
        <label>Warranty until
          <input name="warrantyUntil" type="date">
        </label>
        <label class="span-2">Notes
          <textarea name="notes" rows="3" maxlength="2000"></textarea>
        </label>
        <div class="span-2 photo-field">
          <label>Photo
            <input id="photoInput" type="file" accept="image/*">
          </label>
          <img id="photoPreview" alt="" hidden>
          <button id="removePhoto" class="btn ghost small" type="button" hidden>Remove photo</button>
        </div>
      </div>
      <div class="dialog-actions">
        <button id="deleteItem" class="btn danger" type="button" hidden>Delete</button>
        <span class="spacer"></span>
        <button id="cancelDialog" class="btn ghost" type="button">Cancel</button>
        <button class="btn primary" type="submit">Save</button>
      </div>
    </form>
  </dialog>

  <datalist id="roomOptions"></datalist>
  <datalist id="categoryOptions"></datalist>

  <script src="app.js"></script>
</body>
</html>
